# Everything on one machine (e.g. an Oracle Cloud Always Free VM). See DEPLOY.md.
#   cp .env.example .env   # then edit ADMIN_API_KEY, passwords, PUBLIC_WEB_URL
#   docker compose up -d --build
# The site listens on 127.0.0.1:8080 (server only). Public HTTPS comes from Caddy
# (docker-compose.https.yml, e.g. https://versesforjoy.duckdns.org) or a Cloudflare Tunnel.
# Set WEB_BIND=0.0.0.0 only if you really want the port public.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: verses
      MYSQL_USER: verses
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Small-VM friendly memory settings
      - --innodb-buffer-pool-size=256M
      - --max-connections=60
      - --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: ./backend/.env.docker
    environment:
      DATABASE_URL: mysql://verses:${MYSQL_PASSWORD}@mysql:3306/verses
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
      CORS_ORIGINS: ${PUBLIC_WEB_URL:-http://localhost:8080}
    # Not published: only reachable through the frontend's /api proxy.
    expose:
      - '3000'

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80'

volumes:
  mysql-data:
